[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wizard-central-toolkit"
version = "0.2.1"
description = "Sovereign Developer Utilities Fleet & AI Router"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "rewardsbycode-eng" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "pyfiglet>=1.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "pytest-timeout>=2.1", "mypy>=1.10"]

[project.scripts]
wiz = "wiz_central_toolkit.wiz.__main__:main"
godfather_wizard = "wiz_central_toolkit.godfatherwiz.__main__:main"
godfatherwiz = "wiz_central_toolkit.godfatherwiz.__main__:main"
banner_wizard = "wiz_central_toolkit.bannerwiz.__main__:main"
bannerwiz = "wiz_central_toolkit.bannerwiz.__main__:main"
codeguard_wizard = "wiz_central_toolkit.codeguardwiz.__main__:main"
codeguardwiz = "wiz_central_toolkit.codeguardwiz.__main__:main"
debug_wizard = "wiz_central_toolkit.debugwiz.__main__:main"
debugwiz = "wiz_central_toolkit.debugwiz.__main__:main"
diff_wizard = "wiz_central_toolkit.diffwiz.__main__:main"
diffwiz = "wiz_central_toolkit.diffwiz.__main__:main"
json_wizard = "wiz_central_toolkit.jsonwiz.__main__:main"
jsonwiz = "wiz_central_toolkit.jsonwiz.__main__:main"
python_wizard = "wiz_central_toolkit.pythonwiz.__main__:main"
pythonwiz = "wiz_central_toolkit.pythonwiz.__main__:main"
read_wizard = "wiz_central_toolkit.readwiz.__main__:main"
readwiz = "wiz_central_toolkit.readwiz.__main__:main"
rust_wizard = "wiz_central_toolkit.rustwiz.__main__:main"
rustwiz = "wiz_central_toolkit.rustwiz.__main__:main"
tmux_wizard = "wiz_central_toolkit.tmuxwiz.__main__:main"
tmuxwiz = "wiz_central_toolkit.tmuxwiz.__main__:main"
todo_wizard = "wiz_central_toolkit.todowiz.__main__:main"
todowiz = "wiz_central_toolkit.todowiz.__main__:main"
write_wizard = "wiz_central_toolkit.writewiz.__main__:main"
writewiz = "wiz_central_toolkit.writewiz.__main__:main"

[project.urls]
Homepage = "https://github.com/rewardsbycode-eng/wizard-central-toolkit"
Repository = "https://github.com/rewardsbycode-eng/wizard-central-toolkit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
timeout = 30
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["wiz_central_toolkit"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[project.entry-points."wiz_central_toolkit"]
banner_wizard = "wiz_central_toolkit.bannerwiz.__main__:main"
bannerwiz = "wiz_central_toolkit.bannerwiz.__main__:main"
codeguard_wizard = "wiz_central_toolkit.codeguardwiz.__main__:main"
codeguardwiz = "wiz_central_toolkit.codeguardwiz.__main__:main"
diff_wizard = "wiz_central_toolkit.diffwiz.__main__:main"
diffwiz = "wiz_central_toolkit.diffwiz.__main__:main"
godfather_wizard = "wiz_central_toolkit.godfatherwiz.__main__:main"
godfatherwiz = "wiz_central_toolkit.godfatherwiz.__main__:main"
json_wizard = "wiz_central_toolkit.jsonwiz.__main__:main"
jsonwiz = "wiz_central_toolkit.jsonwiz.__main__:main"
python_wizard = "wiz_central_toolkit.pythonwiz.__main__:main"
pythonwiz = "wiz_central_toolkit.pythonwiz.__main__:main"
read_wizard = "wiz_central_toolkit.readwiz.__main__:main"
readwiz = "wiz_central_toolkit.readwiz.__main__:main"
rust_wizard = "wiz_central_toolkit.rustwiz.__main__:main"
rustwiz = "wiz_central_toolkit.rustwiz.__main__:main"
tmux_wizard = "wiz_central_toolkit.tmuxwiz.__main__:main"
tmuxwiz = "wiz_central_toolkit.tmuxwiz.__main__:main"
todo_wizard = "wiz_central_toolkit.todowiz.__main__:main"
todowiz = "wiz_central_toolkit.todowiz.__main__:main"
write_wizard = "wiz_central_toolkit.writewiz.__main__:main"
writewiz = "wiz_central_toolkit.writewiz.__main__:main"

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
ignore_missing_imports = true
